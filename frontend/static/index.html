<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🗣️ 温州话 ↔ 普通话 实时对话</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
body{background:#0a0a1a;color:#e8eaf0;min-height:100vh;padding:0}
.container{max-width:520px;margin:0 auto;padding:12px;min-height:100vh;display:flex;flex-direction:column}

/* Header */
.header{text-align:center;padding:12px 0 6px}
.header h1{font-size:18px;color:#06b6d4;display:flex;align-items:center;justify-content:center;gap:6px}
.header .sub{font-size:11px;color:#6a6e8a;margin:2px 0 6px}

/* Mode bar */
.mode-bar{display:flex;gap:4px;margin-bottom:8px}
.mode-btn{flex:1;padding:7px 4px;border:none;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;background:#1e1e45;color:#6a6e8a;transition:all .2s;text-align:center;white-space:nowrap}
.mode-btn.active{background:#06b6d4;color:#fff}
.mode-btn:active{transform:scale(0.96)}
.mode-btn.indicator{font-size:10px;padding:7px 2px;background:#1e1e45;color:#8a8eb0}

/* Waveform */
.waveform{height:48px;background:#0f0f25;border-radius:10px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.waveform canvas{width:100%;height:100%;display:block}
.waveform.idle{opacity:.4}
.waveform.active{opacity:1;border:1px solid #06b6d430}

/* Chat */
.chat-area{flex:1;overflow-y:auto;padding:2px 0 6px;display:flex;flex-direction:column;gap:3px;min-height:100px;max-height:50vh}
.chat-msg{padding:6px 10px;border-radius:8px;line-height:1.5;font-size:13px;animation:fadeIn .2s ease;max-width:90%}
.chat-msg.self{align-self:flex-end;background:#064663;border:1px solid #065a78;border-bottom-right-radius:2px}
.chat-msg.other{align-self:flex-start;background:#16163a;border:1px solid #262650;border-bottom-left-radius:2px}
.chat-msg .label{font-size:10px;color:#6a6e8a;margin-bottom:2px;display:flex;gap:4px;align-items:center}
.chat-msg .label .badge{background:#06b6d440;color:#06b6d4;padding:0 5px;border-radius:3px;font-size:9px;font-weight:600}
.chat-msg .text{word-break:break-word}
.chat-msg .asr-raw{font-size:11px;color:#8a8eb0;margin-top:4px;padding-top:4px;border-top:1px solid #1e1e45}
.interim{border-left:2px solid #06b6d4;animation:blink-border 1s infinite}
@keyframes blink-border{0%,100%{border-left-color:#06b6d4}50%{border-left-color:transparent}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#4a4e6a;font-size:13px;gap:4px}
.empty-chat .icon{font-size:28px}

/* Control bar */
.control-bar{background:#16163a;border-radius:14px;padding:10px;border:1px solid #262650;margin-top:auto}
.rec-row{display:flex;gap:6px;align-items:center}
.rec-btn{flex:1;padding:14px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.rec-btn.idle{background:#06b6d4;color:#fff}
.rec-btn.recording{background:#ef4444;color:#fff;animation:pulse 1.2s infinite}
.rec-btn:active{transform:scale(0.96)}
.rec-btn:disabled{background:#333;color:#555;cursor:not-allowed}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.file-btn{padding:12px;border-radius:10px;border:1px dashed #333;background:#1e1e45;color:#8a8eb0;cursor:pointer;font-size:16px;min-width:44px;display:flex;align-items:center;justify-content:center}
.file-btn:active{background:#262650}
.timer{font-size:12px;color:#aaa;min-width:36px;text-align:center;font-variant-numeric:tabular-nums}
.status-bar{font-size:10px;color:#6a6e8a;text-align:center;margin-top:6px;min-height:16px}

/* Level indicator */
.level-bar{height:3px;background:#0f0f25;border-radius:2px;margin:6px 10px 0;overflow:hidden}
.level-fill{height:100%;width:0%;background:linear-gradient(90deg,#06b6d4,#22c55e);border-radius:2px;transition:width .1s}

@media(max-width:400px){
  .container{padding:8px}
  .chat-msg{max-width:95%}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🗣️ 温州话 ↔ 普通话</h1>
    <div class="sub">点击录音 · 边说边译 · 自动方向</div>
  </div>

  <div class="mode-bar">
    <button class="mode-btn active" data-mode="auto" onclick="switchMode('auto')">🤖 自动</button>
    <button class="mode-btn" data-mode="wenzhou_to_mandarin" onclick="switchMode('wenzhou_to_mandarin')">📍 温→普</button>
    <button class="mode-btn" data-mode="mandarin_to_wenzhou" onclick="switchMode('mandarin_to_wenzhou')">📍 普→温</button>
    <button class="mode-btn indicator" id="dirIndicator">⏳ 检测中</button>
  </div>

  <!-- Waveform -->
  <div class="waveform idle" id="waveform">
    <canvas id="waveCanvas"></canvas>
  </div>
  <div class="level-bar"><div class="level-fill" id="levelFill"></div></div>

  <!-- Chat -->
  <div class="chat-area" id="chatArea">
    <div class="empty-chat" id="emptyHint">
      <div class="icon">🎙️</div>
      <div>点击录音，说完再点停止</div>
    </div>
  </div>

  <!-- Control -->
  <div class="control-bar">
    <div class="rec-row">
      <button class="rec-btn idle" id="recBtn" onclick="toggleRec()">
        <span id="recIcon">🎙️</span>
        <span id="recBtnText">点击开始录音</span>
      </button>
      <span class="timer" id="timer">0:00</span>
      <label class="file-btn" title="上传音频文件">
        📁
        <input type="file" accept="audio/*" style="display:none" id="fileInput" onchange="handleFile(event)">
      </label>
    </div>
    <div class="status-bar" id="statusBar">点击 🎙️ 开始对话</div>
  </div>
</div>

<audio id="ttsPlayer" style="display:none"></audio>

<script>
// ═══════════════════════════════════════════
//  State
// ═══════════════════════════════════════════
let currentMode = 'auto';
let isRecording = false;
let isProcessing = false;
let mediaRecorder = null;
let audioCtx = null;
let analyser = null;
let stream = null;
let recordingTimer = null;
let seconds = 0;
let chunksSent = 0;
const BASE = window.location.origin;
const CHUNK_MS = 2000;     // send every 2s while recording
const MIN_CHUNK_MS = 500;  // first chunk can be shorter

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  setupWaveCanvas();
  setInterval(() => { if (isRecording) updateTimer(); }, 200);
  setInterval(() => { if (isRecording) checkServer(); }, 5000);
});

// ═══════════════════════════════════════════
//  Mode
// ═══════════════════════════════════════════
function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn[data-mode]').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode)
  );
  document.getElementById('dirIndicator').textContent =
    mode === 'auto' ? '⏳ 自动检测' :
    mode === 'wenzhou_to_mandarin' ? '📍 温→普' :
    mode === 'mandarin_to_wenzhou' ? '📍 普→温' : '📝 转写';
  addSysMsg('切换到 ' + document.querySelector(`.mode-btn[data-mode="${mode}"]`).textContent.trim());
}

// ═══════════════════════════════════════════
//  Waveform canvas
// ═══════════════════════════════════════════
function setupWaveCanvas() {
  const c = document.getElementById('waveCanvas');
  const rect = document.getElementById('waveform').getBoundingClientRect();
  c.width = rect.width || 360;
  c.height = rect.height || 48;
}
function drawLevel(level) { // level 0-1
  const c = document.getElementById('waveCanvas');
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  if (level <= 0) return;
  const bars = Math.floor(c.width / 6);
  ctx.fillStyle = '#06b6d4';
  for (let i = 0; i < bars; i++) {
    const h = Math.max(2, level * (18 + Math.random() * 24));
    const x = i * 6 + 2;
    ctx.fillRect(x, c.height - h, 3, h);
  }
}
function updateLevel() {
  if (!analyser || !isRecording) return;
  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteTimeDomainData(data);
  let sum = 0;
  for (let i = 0; i < data.length; i++) sum += Math.abs(data[i] - 128);
  const level = Math.min(1, sum / data.length / 64);
  drawLevel(level);
  document.getElementById('levelFill').style.width = (level * 100) + '%';
  requestAnimationFrame(updateLevel);
}

// ═══════════════════════════════════════════
//  Recording (tap to start/stop)
// ═══════════════════════════════════════════
async function toggleRec() {
  if (isRecording) { stopRecording(); return; }
  if (isProcessing) return;

  if (!navigator.mediaDevices?.getUserMedia) {
    alert('浏览器不支持录音，用文件上传');
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser);

    // Use MediaRecorder with timeslice for streaming chunks
    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus' : 'audio/webm';
    mediaRecorder = new MediaRecorder(stream, { mimeType });
    audioChunks = [];
    chunksSent = 0;

    // For first chunk, use shorter interval
    let first = true;
    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) {
        if (first) {
          // First chunk arrives sooner than timeslice (browser sends initial buffer)
          first = false;
        }
        sendChunk(e.data);
      }
    };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
    };

    // Start with timeslice = every CHUNK_MS we get ondataavailable
    mediaRecorder.start(CHUNK_MS);

    isRecording = true;
    seconds = 0;
    document.getElementById('recBtn').className = 'rec-btn recording';
    document.getElementById('recIcon').textContent = '⏹';
    document.getElementById('recBtnText').textContent = '停止录音';
    document.getElementById('waveform').className = 'waveform active';
    document.getElementById('emptyHint')?.remove();
    updateLevel();
    addSysMsg('🎤 录音中...');

  } catch(e) {
    alert('无法访问麦克风: ' + e.message);
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  isRecording = false;
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  analyser = null;
  clearInterval(recordingTimer);
  document.getElementById('recBtn').className = 'rec-btn idle';
  document.getElementById('recIcon').textContent = '🎙️';
  document.getElementById('recBtnText').textContent = '点击开始录音';
  document.getElementById('timer').textContent = formatTime(seconds);
  document.getElementById('waveform').className = 'waveform idle';
  drawLevel(0);
  document.getElementById('levelFill').style.width = '0%';
}

// ═══════════════════════════════════════════
//  Send audio chunk immediately
// ═══════════════════════════════════════════
function sendChunk(blob) {
  chunksSent++;

  // Determine direction for this chunk
  let direction = currentMode;
  if (direction === 'auto') {
    // For auto mode, default to wenzhou→mandarin and let server detect
    direction = 'wenzhou_to_mandarin';
  }

  const formData = new FormData();
  formData.append('audio', blob, `chunk_${chunksSent}.webm`);
  formData.append('direction', direction);
  formData.append('context', '');

  // Send and show result
  fetch(BASE + '/api/translate', { method: 'POST', body: formData })
    .then(r => r.json())
    .then(data => {
      if (data.error) return;
      if (data.target_text || data.asr_raw) {
        showResult(direction || 'wenzhou_to_mandarin', data.target_text, data.asr_raw, data.tts_url);
      }
    })
    .catch(() => {});
}

// ═══════════════════════════════════════════
//  File upload (one-shot)
// ═══════════════════════════════════════════
function handleFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = '';

  let direction = currentMode;
  if (direction === 'auto') direction = 'wenzhou_to_mandarin';

  const formData = new FormData();
  formData.append('audio', file);
  formData.append('direction', direction);
  formData.append('context', '');

  addSysMsg('📁 处理文件...');
  fetch(BASE + '/api/translate', { method: 'POST', body: formData })
    .then(r => r.json())
    .then(data => {
      if (data.error) { addSysMsg('❌ ' + data.error); return; }
      if (data.target_text || data.asr_raw) {
        showResult(direction, data.target_text, data.asr_raw, data.tts_url);
      }
      // Auto-play TTS
      if (data.tts_url) {
        setTimeout(() => { const p = document.getElementById('ttsPlayer'); p.src = data.tts_url; p.play().catch(()=>{}); }, 300);
      }
    })
    .catch(() => addSysMsg('❌ 上传失败'));
}

// ═══════════════════════════════════════════
//  Display
// ═══════════════════════════════════════════
function showResult(direction, target, asrRaw, ttsUrl) {
  if (!target && !asrRaw) return;

  const badge =
    direction === 'wenzhou_to_mandarin' ? '温→普' :
    direction === 'mandarin_to_wenzhou' ? '普→温' : '转写';

  // Show recognized speech (left side - "what I said")
  if (asrRaw && asrRaw !== target) {
    const div1 = document.createElement('div');
    div1.className = 'chat-msg other';
    div1.innerHTML = `<div class="label"><span class="badge">🗣️</span> 识别</div><div class="text">${escapeHtml(asrRaw)}</div>`;
    chatArea.appendChild(div1);
  }

  // Show translation (right side - "what it means")
  if (target) {
    const div2 = document.createElement('div');
    div2.className = 'chat-msg self';
    let html = `<div class="label"><span class="badge">${badge}</span> 翻译`;
    if (ttsUrl) html += ` <button class="play-tts" onclick="playTTS('${ttsUrl}')">🔊</button>`;
    html += `</div><div class="text">${escapeHtml(target)}</div>`;
    div2.innerHTML = html;
    chatArea.appendChild(div2);
  }

  chatArea.scrollTop = chatArea.scrollHeight;
}

function addSysMsg(text) {
  const e = document.getElementById('emptyHint');
  if (e) e.remove();
  const div = document.createElement('div');
  div.style.cssText = 'text-align:center;font-size:11px;color:#6a6e8a;padding:4px';
  div.textContent = text;
  document.getElementById('chatArea').appendChild(div);
  document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
}

// ═══════════════════════════════════════════
//  Health check
// ═══════════════════════════════════════════
function checkServer() {
  fetch(BASE + '/api/lexicon/count', { method: 'GET', cache: 'no-cache' })
    .then(r => r.json())
    .then(d => {
      document.getElementById('dirIndicator').textContent =
        currentMode === 'auto' ? `🤖 ${d.mandarin_to_wenzhou}词` : document.querySelector(`.mode-btn[data-mode="${currentMode}"]`)?.textContent || '';
    })
    .catch(() => {});
}

// ═══════════════════════════════════════════
//  Timer
// ═══════════════════════════════════════════
function updateTimer() {
  // seconds increases from interval
}
function formatTime(s) {
  const m = Math.floor(s/60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

// ═══════════════════════════════════════════
//  Utils
// ═══════════════════════════════════════════
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function playTTS(url) {
  const p = document.getElementById('ttsPlayer');
  p.src = url; p.play().catch(()=>{});
}
</script>
</body>
</html>
