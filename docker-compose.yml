version: "3.9"
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "7860:7860"
    environment:
      - ASR_BACKEND=mock
      - TTS_BACKEND=mock
      - LLM_BACKEND=rules
      - SAVE_CORRECTIONS=true
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    restart: unless-stopped
