name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          # Use mock backend for CI
          export ASR_BACKEND=mock
          export TTS_BACKEND=mock
          export LLM_BACKEND=rules
          python -m pytest tests/ -v --cov=backend --cov=scripts --cov-report=term-missing

      - name: Check import (full pipeline with mock)
        run: |
          export ASR_BACKEND=mock
          python -c "
from backend.asr_engine import ASREngine
from backend.pipeline import Wenzhou2MandarinPipeline
from backend.llm_normalizer import MandarinNormalizer
from backend.correction_store import CorrectionStore
print('All imports OK')
"

      - name: Check frontend imports
        run: |
          python -c "
import sys
sys.path.insert(0, '.')
from backend.pipeline import Wenzhou2MandarinPipeline
print('Frontend dependencies OK')
"
